name: CI Pipeline

on:
  push:
    branches: [ main, homebase, basecamp ]
  pull_request:
    branches: [ main, homebase, basecamp ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ --maxfail=1 --disable-warnings -q --cov=processors --cov=scrapers --cov-report=term-missing

  docs:
    name: Documentation Health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install doc tools
        run: |
          python -m pip install --upgrade pip
          pip install markdown-link-checker mdformat

      - name: Check Markdown formatting
        run: |
          mdformat --check README.md docs/

      - name: Check links in Markdown
        run: |
          markdown-link-checker README.md
          markdown-link-checker docs/
