site_name: GRIMdata
site_description: Global Rights Index Monitoring — research on rights, public decisions and research continuity, with published studies, evidence tools and methods
site_author: GRIMdata Project
site_url: https://grimdata.org

# Repository
# Note: Site is built from DigitalChild repo (LittleRainbowRights project)
# SGBV-UPR has separate repo: github.com/MissCrispenCakes/HumanRights
repo_name: MissCrispenCakes/DigitalChild
repo_url: https://github.com/MissCrispenCakes/DigitalChild
edit_uri: edit/basecamp/docs/

# Copyright
copyright: |
  &copy; 2026 GRIMdata · Independent open research<br>
  <a href="/practices/">Site practices &amp; data handling</a> ·
  <a href="https://github.com/MissCrispenCakes/DigitalChild">Source code</a>

# Internal/process docs kept in git for the working trail, but NOT published to the
# live site (they were reachable by URL/search even though absent from the nav).
# gitignore-style, relative to docs/. See docs/planning/SITE_IA_SEE_VS_BUILD_PLAN.md.
exclude_docs: |
  overrides/partials/source.html
  planning/REVAMP_VERIFICATION.md
  planning/PROGRAMME_VERIFICATION.md
  README.md
  API_WEEK1_SUMMARY.md
  API_WEEK2_SUMMARY.md
  API_DEPENDENCY_UPDATE.md
  UPDATE_SUMMARY_JAN2026.md
  UPDATE_SUMMARY_JUN2026.md
  WEBSITE_API_UPDATE.md
  WEBSITE_RESTRUCTURE_PLAN.md
  RELEASE_CORRECTIONS_NEEDED.md
  NAVIGATION_IMPROVEMENTS.md
  notes/NEXT_STEPS_PLAN.md
  standards/DOC_CLASSIFIER.md

# Theme
theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font: false
  features:
    - navigation.instant
    # Disabled: Too aggressive, causes slowness
    # - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    # Disabled: Can conflict with toc.integrate
    # - navigation.indexes
    - navigation.footer
    - toc.follow
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    logo: material/chart-timeline-variant

# Local SVG icons and Unicode emoji; no unsolicited emoji image requests.
hooks:
  - hooks/local_emoji.py

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - tags

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MissCrispenCakes/DigitalChild
      name: GitHub Repository
    - icon: fontawesome/solid/globe
      link: https://littlerainbowrights.com
      name: LittleRainbowRights
  # analytics:  # Uncomment and add Google Analytics ID if desired
  #   provider: google
  #   property: G-XXXXXXXXXX
  alternate:
    - name: English
      link: /
      lang: en

# Navigation
# Nav is organised by the Diátaxis framework (https://diataxis.fr):
#   Explore        — the live product (see the data)
#   Tutorials      — learning-oriented, start here
#   How-to guides  — task-oriented, get something done
#   Reference      — information-oriented, look it up
#   Explanation    — understanding-oriented, why it works this way
# Plus Projects (project landing pages) and About. Pages are regrouped only —
# file paths (and therefore URLs) are unchanged.
nav:
  - Home: index.md
  - Explore:
      - Explore Evidence: explore/index.md
      - Scorecard Overview: scorecard/index.md
      - Map & Charts: scorecard/visualization.md
      - Country Explorer: scorecard/explorer.md
      - Source Transparency Watch: transparency-watch/index.md
  - Projects:
      - Research Tracks: projects/index.md
      - Research Directions: research-directions/index.md
      - LittleRainbowRights: website/projects/littlerainbowrights/index.md
      - SGBV-UPR: website/projects/sgbv/index.md
  - Documentation:
      - Documentation Home: docs/index.md
      - Start Here: website/getting-started/start-here.md
      - Tutorials:
          - First Country Assessment: tutorials/first-country.md
          - Install & First Run: website/getting-started/quickstart.md
      - How-to guides:
          - Assess a Source: planning/SOURCE_FEASIBILITY_CHECKLIST.md
          - Installation: website/getting-started/installation.md
          - Self-hosted API Quick Start: api/quickstart.md
          - Get the Data: scorecard/data-access.md
          - Run the Pipeline (Runbook): guides/RUNBOOK.md
          - Scorecard Workflow: guides/SCORECARD_WORKFLOW.md
          - Use the Validators: guides/VALIDATORS_USAGE.md
          - Deploy to Production: guides/PRODUCTION_DEPLOYMENT.md
          - Troubleshoot First-Run Errors: guides/FIRST_RUN_ERRORS.md
      - Reference:
          - API:
              - Overview: api/index.md
              - Endpoint Reference: api/reference.md
              - Quick Reference (cheat sheet): api/quick-reference.md
          - Pipeline Logging: notes/PIPELINE_LOGGING.md
          - Glossary: GLOSSARY.md
          - Standards:
              - Metadata Schema: standards/METADATA_SCHEMA.md
              - File Naming: standards/FILE_NAMING_STANDARDS.md
              - Document Types: standards/DOC_TYPE_STANDARDS.md
              - Scraper Structure: standards/SCRAPER_STRUCTURE.md
              - Tags Config: standards/TAGS_CONFIG_FORMAT.md
              - Recommendations Config: standards/RECOMMENDATIONS_CONFIG_FORMAT.md
              - Comparison Config: standards/COMPARISON_CONFIG_FORMAT.md
              - Filters Config: standards/FILTERS_CONFIG_FORMAT.md
              - ISO Mapping: standards/ISO_MAPPING.md
          - Notes:
              - Directory Structure: notes/DIRECTORY_STRUCTURE.md
              - Tags Main Notes: notes/TAGS_MAIN_NOTES.md
              - Tags Export Notes: notes/TAGS_EXPORT_NOTES.md
              - Comparison Export Notes: notes/COMPARISON_EXPORT_NOTES.md
          - Docs Index: DOCS_INDEX.md
          - Development Records:
              - DigitalChild/LRR Software Roadmap: ROADMAP.md
              - API Implementation History: api/IMPLEMENTATION_HISTORY.md
              - URL Compatibility Map: planning/URL_MIGRATION_MAP.md
              - Repository Terms: CONTRIBUTING.md
      - Explanation:
          - Scorecard Design & Methodology: scorecard/design.md
          - Architecture: ARCHITECTURE.md
          - Pipeline Flow: notes/PIPELINE_FLOW.md
          - Site Practices & Data Handling: practices/index.md
          - Data Governance: DATA_GOVERNANCE.md
          - Research Context: RESEARCH_CONTEXT.md
      - Technical Overview & Citation: docs/technical-overview.md
  - About:
      - About GRIMdata: website/index.md
      - Research History: research-history/index.md
      - Research Context: RESEARCH_CONTEXT.md
      - Data Governance: DATA_GOVERNANCE.md
      - FAQ: FAQ.md

# Custom CSS
extra_css:
  - website/stylesheets/extra.css?v=20261004-revamp2
  - website/stylesheets/platform.css?v=20261005-programme1

# Custom JavaScript
extra_javascript:
  - website/javascripts/extra.js?v=20261005-programme1
  - website/javascripts/scorecard.js?v=20261004-revamp2
  - website/javascripts/transparency.js?v=20261004-revamp2
  # Plotly is requested only after explicit page-level chart loading.
